[workspace]
resolver = "2"
members = [
    "crates/inferd-proto",
    "crates/inferd-engine",
    "crates/inferd-daemon",
    "crates/inferd-client",
    "crates/inferd",
]
# fuzz harnesses are intentionally NOT workspace members — they require
# nightly Rust + libfuzzer-sys + their own resolver. See
# crates/inferd-proto/fuzz/Cargo.toml.
exclude = ["crates/inferd-proto/fuzz"]

[workspace.package]
version = "0.4.0-rc.3"
edition = "2024"
# Edition 2024 (stable since Rust 1.85) requires rust-version >= 1.85.
# 1.89 is the floor we already need for std::fs::File::try_lock used
# in inferd-daemon::lock. That API replaces a third-party crate (fs4)
# for cross-platform single-instance locking and is the obvious right
# answer now that std ships it.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/3rg0n/inferd"
homepage = "https://inferd.io"
authors = ["3rg0n"]

[workspace.dependencies]
# Versions are centralised so every crate picks the same one. Add to
# this block as crates come online; don't pin them inside individual
# crate manifests.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
subtle = "2"
async-trait = "0.1"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
