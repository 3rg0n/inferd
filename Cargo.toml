[workspace]
resolver = "2"
members = [
    "crates/inferd-proto",
    "crates/inferd-engine",
    # Activated as each crate's source files land in M1+:
    # "crates/inferd-daemon",
    # "crates/inferd-stdio",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.76"
license = "MIT"
repository = "https://github.com/3rg0n/inferd"
homepage = "https://inferd.io"
authors = ["3rg0n"]

[workspace.dependencies]
# Versions are centralised so every crate picks the same one. Add to
# this block as crates come online; don't pin them inside individual
# crate manifests.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
subtle = "2"
async-trait = "0.1"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
