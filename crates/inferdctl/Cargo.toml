[package]
name = "inferdctl"
description = "Operator CLI for inferd: status, watch, pull, doctor."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
name = "inferdctl"
path = "src/main.rs"

[dependencies]
# Reuses the daemon's internals on purpose: `inferdctl pull` writes
# into the same CAS store the daemon reads from, and `inferdctl
# status` consumes the admin protocol the daemon publishes. Sharing
# the type definitions avoids drift.
inferd-client = { path = "../inferd-client", version = "=0.1.9" }
inferd-daemon = { path = "../inferd-daemon", version = "=0.1.9" }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
clap         = { workspace = true }
