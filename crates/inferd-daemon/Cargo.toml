[package]
name = "inferd-daemon"
description = "The inferd daemon: IPC over Unix socket / Windows named pipe (length-prefixed type-tagged frames for generation, NDJSON for embeddings), admission queue, single-instance lock, router, grammar support, activity log."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
name = "inferd-daemon"
path = "src/main.rs"

[features]
default = []
# The daemon binary picks its engine adapters at compile time. CI builds
# the full feature set; minimal builds (e.g. headless servers without GPU)
# drop the GPU features.
llamacpp             = ["inferd-engine/llamacpp"]
llamacpp-integration = ["llamacpp", "inferd-engine/llamacpp-integration"]
# v0.3 / ADR 0019: dynamic-loader path. libllama becomes a shared
# library; ggml backends become MODULE libs dlopen'd at runtime;
# inferd-daemon picks the strongest available accelerator at boot.
# Implies daemon-side `llamacpp` so `--backend llamacpp` is wired
# through to the engine adapter.
dl-backends          = ["llamacpp", "inferd-engine/dl-backends"]
cuda     = ["inferd-engine/cuda"]
metal    = ["inferd-engine/metal"]
vulkan   = ["inferd-engine/vulkan"]
rocm     = ["inferd-engine/rocm"]
# OpenAI-compat outbound HTTPS adapter (Phase 5A). Daemon-side
# enables `--backend openai-compat` plus the matching `--openai-*`
# CLI flags. Pulls in the engine's `openai` feature.
openai   = ["inferd-engine/openai"]
# AWS Bedrock-runtime InvokeModelWithResponseStream adapter (Phase
# 6B-5). Daemon-side enables `--backend bedrock-invoke` plus the
# matching `--bedrock-*` CLI flags and the
# `kind: "bedrock-invoke"` config-file entry. Pulls in the engine's
# `bedrock` feature.
bedrock  = ["inferd-engine/bedrock"]
# Tier 5 security regression tests live behind this feature.
security = []

[dependencies]
inferd-proto  = { path = "../inferd-proto", version = "=0.6.0-rc.2" }
inferd-engine = { path = "../inferd-engine", version = "=0.6.0-rc.2" }
tokio               = { workspace = true }
tokio-stream        = "0.1"
serde               = { workspace = true }
serde_json          = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
anyhow              = { workspace = true }
thiserror           = { workspace = true }
clap                = { workspace = true }
bytes               = { workspace = true }
regex               = "1"
chrono              = { version = "0.4", default-features = false, features = ["clock", "serde"] }
subtle              = { workspace = true }
sha2                = { workspace = true }
# Pure-Rust HTTPS client for first-boot model bootstrap (ADR 0010).
# Narrow scope: one URL, one SHA, one file. Operators wanting fancier
# transports (proxies, custom DNS) wget the file themselves and drop
# it in models_dir.
ureq                = { version = "2", default-features = false, features = ["tls", "native-certs"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["fs", "user", "socket"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
async-trait = { workspace = true }
