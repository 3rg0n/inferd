[package]
name = "inferd-http"
description = "OpenAI-compatible HTTP server for inferd (ADR 0020 Surface A). A user-launched, separate process that exposes /v1/chat/completions and /v1/embeddings over localhost and translates them to the daemon's native v2/embed IPC wire via inferd-client. The daemon itself never serves HTTP (ADR 0006/0022); this is a consumer, not a privileged surface (ADR 0014)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
name = "inferd-http"
path = "src/main.rs"

[dependencies]
# Consumes the daemon over IPC like any other middleware (ADR 0014).
inferd-client      = { path = "../inferd-client", version = "=0.8.0" }
inferd-proto       = { path = "../inferd-proto", version = "=0.8.0" }
# One canonical OpenAI wire definition, shared with the outbound adapter.
inferd-openai-wire = { path = "../inferd-openai-wire", version = "=0.8.0" }
tokio              = { workspace = true }
tokio-stream       = "0.1"
futures-util       = "0.3"
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
clap               = { workspace = true }
# Constant-time bearer-token compare (same crate the daemon uses for
# SHA compares) — avoids a timing side-channel on the token.
subtle             = { workspace = true }
# HTTP server. axum has first-class SSE support for streaming chat.
axum               = { version = "0.7", features = ["json"] }
# Decode OpenAI `image_url` (data: URL) PNG/JPEG payloads to raw RGB for
# an inferd image attachment — the daemon links no image codec (ADR 0016),
# so the bridge (as the consumer) decodes. png/jpeg only; no default codecs.
image              = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# base64-decode data: URL image payloads. Standard alphabet.
base64             = "0.22"
# Decode OpenAI `input_audio` (base64 wav/mp3) to f32 PCM — same ADR 0016
# reasoning as `image` above: the daemon links no audio codec, so the
# bridge decodes. `wav`/`mp3` are the two formats the OpenAI wire defines;
# `pcm` is the *codec* inside a RIFF/wav container (a separate feature from
# the container reader), so omitting it makes every wav decode fail at
# codec lookup. MPL-2.0 (file-level copyleft; see ADR 0025).
symphonia          = { version = "0.6", default-features = false, features = ["wav", "mp3", "pcm"] }
# Resample decoded audio to the rate the backend requires. The daemon
# refuses a mismatch rather than mis-feeding a rate-less encoder (ADR
# 0025), and rate conversion is the consumer's job (ADR 0016).
rubato             = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
