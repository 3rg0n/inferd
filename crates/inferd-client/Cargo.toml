[package]
name = "inferd-client"
description = "Rust client for the inferd local-inference daemon. NDJSON-over-IPC, admin event subscription, retry-and-wait helpers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
readme = "README.md"
keywords    = ["inferd", "client", "llm", "inference", "ipc"]
categories  = ["api-bindings", "asynchronous"]

[lib]
# Crate is publishable to crates.io. No path-only deps; everything
# resolves to a published version of inferd-proto.

[dependencies]
# Path AND version: cargo prefers the path during local workspace
# development, falls back to the registry version when consumed as
# an external crate from crates.io. Both sides must move in lockstep
# at publish time.
inferd-proto = { path = "../inferd-proto", version = "=0.1.8" }
tokio        = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
