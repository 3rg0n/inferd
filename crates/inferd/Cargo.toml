[package]
name = "inferd"
description = "Single CLI binary for inferd: status / watch / pull / doctor today; -p prompt mode in a future release. Same gh / kubectl shape — one tool, many subcommands."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
name = "inferd"
path = "src/main.rs"

[dependencies]
# Reuses the daemon's internals on purpose: `inferd pull` writes
# into the same CAS store the daemon reads from, and `inferd
# status` consumes the admin protocol the daemon publishes.
# Sharing the type definitions avoids drift.
inferd-client = { path = "../inferd-client", version = "=0.1.12" }
inferd-daemon = { path = "../inferd-daemon", version = "=0.1.12" }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
clap               = { workspace = true }
