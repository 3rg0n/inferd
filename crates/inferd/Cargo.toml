[package]
name = "inferdctl"
description = "Single CLI binary for inferd: status / watch / pull / doctor today; -p prompt mode in a future release. Same gh / kubectl shape — one tool, many subcommands."
readme                 = "README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
name = "inferdctl"
path = "src/main.rs"

[features]
default = ["model-fetch"]
# Forwards the daemon's default-on `model-fetch` (ADR 0028). This must
# be a forwarding feature rather than a plain dependency: `inferdctl`
# links `inferd-daemon`, so if it enabled the daemon's defaults
# unconditionally, building the CLI with `--no-default-features` would
# still pull `ureq`/`rustls` into the airgapped tarball — the artifact
# would carry a TLS stack while claiming not to. `ci.yml`'s
# `no-network-deps` job asserts this for both binaries.
#
# Without it, `inferdctl pull` reports `fetch_disabled` and `inferdctl
# import` is the way models get in.
model-fetch = ["inferd-daemon/model-fetch"]

[dependencies]
# Reuses the daemon's internals on purpose: `inferdctl pull` writes
# into the same CAS store the daemon reads from, and `inferdctl
# status` consumes the admin protocol the daemon publishes.
# Sharing the type definitions avoids drift.
inferd-client = { path = "../inferd-client", version = "=0.7.0" }
inferd-daemon = { path = "../inferd-daemon", version = "=0.7.0", default-features = false }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
clap               = { workspace = true }

[dev-dependencies]
# Per-test temp dirs: the config-resolution tests write a config file
# each, and shared fixed paths under `env::temp_dir()` collide under
# cargo's parallel test threads.
tempfile = "3"
