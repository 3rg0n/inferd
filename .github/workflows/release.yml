name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0-alpha.1`). Builds the
# inferd-daemon binary on every supported platform, signs the artefact
# with cosign (keyless OIDC), generates a CycloneDX SBOM, and attaches
# everything to a GitHub Release.
#
# Platforms shipped:
#   - linux x86_64 (gnu)
#   - linux aarch64 (gnu)
#   - macos aarch64 (Apple Silicon)
#   - windows x86_64 (msvc)
#
# Windows aarch64 was attempted via `windows-11-arm` in v0.1.7 but
# the llamacpp build failed on the runner — likely an LLVM/clang
# setup difference vs the x64 image. Held until that's debugged;
# see #63 for the issue.
#
# Builds ship with the `dl-backends` feature (ADR 0019, v0.3) so
# the binary supports real inference out of the box, with the
# strongest available ggml backend (Metal / CUDA / ROCm / Vulkan /
# CPU) picked at runtime. Tarballs include a `backends/` subdir
# with the staged shared+MODULE libs (libllama, libggml,
# libggml-base, ggml-cpu-* CPU variants, plus per-platform
# accelerator MODULEs); the daemon's RPATH (`$ORIGIN` /
# `@loader_path`) means it loads them from next-to-the-binary at
# runtime, no system-wide install required.
#
# aarch64-linux uses GitHub's native arm64 runner
# (`ubuntu-24.04-arm`, free for public repos since January 2025).
# Native build means the same `cargo build --features llamacpp`
# formula as x86_64 — no `cross`, no foreign-target C++ toolchain
# headache.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create release + upload assets
  id-token: write   # cosign keyless signing

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 Linux ships dl-backends + cuda. nvcc + cudart for the
          # cuda MODULE are installed via the Jimver/cuda-toolkit step
          # below (only on this matrix entry). Other targets stay on
          # dl-backends alone (CPU + per-arch accelerator: Metal on
          # macOS, none extra on aarch64-linux or Windows for now).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            features: inferd-daemon/dl-backends,inferd-daemon/cuda
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            features: inferd-daemon/dl-backends
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            features: inferd-daemon/dl-backends
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            features: inferd-daemon/dl-backends
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # llamacpp feature builds need the vendored llama.cpp submodule.
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}

      # libclang for bindgen, plus the platform's C++ toolchain.
      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      # CUDA toolkit for x86_64-linux only — needed because that target's
      # `features:` includes inferd-daemon/cuda, which flips
      # GGML_CUDA=ON and asks build.rs to compile libggml-cuda.so via
      # nvcc. ubuntu-latest = 24.04 (glibc 2.39) which is compatible
      # with CUDA 12.6's bundled headers.
      #
      # The runner image already provides gcc-13 as default which CUDA
      # 12.6 supports. Sub-packages are the minimum to compile +
      # link a runtime-loadable libggml-cuda.so: nvcc for the device
      # compiler, cudart for cudaMalloc/cudaMemcpy, cublas for the
      # GEMM kernels ggml-cuda calls into, plus the cccl headers
      # ggml-cuda's templates need.
      - name: Install CUDA toolkit (Linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76  # v0.2.35
        with:
          cuda: '12.6.0'
          method: 'network'
          # Jimver always rewrites sub-package names to
          # `cuda-<name>-<MAJOR>-<MINOR>`. That works for nvcc /
          # cudart / cccl (NVIDIA does ship `cuda-nvcc-12-6` etc) but
          # fails for cublas — CUDA 12.x's cublas packages are
          # `libcublas-12-6` / `libcublas-dev-12-6` (NO `cuda-`
          # prefix), and Jimver has no escape hatch to pass them
          # through verbatim. Both rc.1 (`cuda-cublas-12-6`) and rc.2
          # (`cuda-libcublas-12-6`) tried it via Jimver and apt
          # rejected both with "Unable to locate package". The
          # follow-up step below installs cublas via plain apt-get
          # against the NVIDIA repo Jimver has already configured.
          sub-packages: '["nvcc","cudart","cudart-dev","cccl"]'
          linux-local-args: '["--toolkit"]'

      - name: Install cuBLAS (Linux x86_64 only, post-Jimver)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          # ggml-cuda links against cublas for GEMM kernels; both the
          # runtime and dev (headers) packages are needed because the
          # MODULE build runs nvcc + g++ which #include cublas_v2.h.
          sudo apt-get install -y libcublas-12-6 libcublas-dev-12-6

      # No rust-cache for release builds. Release runs are rare,
      # correctness > speed, and we've now seen Swatinem's cache
      # serve a mock-only target dir for a llamacpp build twice
      # (v0.1.1, v0.1.4). The binary-size guard catches it after
      # the fact, but the cleaner fix is to never cache at all on
      # the release path. Each release does a clean build from
      # scratch — adds ~5 min per platform, eliminates the
      # silent-mock-tarball failure mode.

      - name: Build daemon (with dl-backends)
        # Use `inferd-daemon/dl-backends` (the daemon's own feature) not
        # `inferd-engine/dl-backends`. The daemon's `dl-backends` feature
        # activates the engine's `dl-backends` via dep-feature forwarding,
        # AND it implies the daemon's `llamacpp` feature so the
        # `BackendKind::Llamacpp` match arm compiles in. Passing only
        # `inferd-engine/dl-backends` compiles the engine code but leaves
        # the daemon arm gated out — resulting in a binary that rejects
        # `--backend llamacpp` at runtime.
        #
        # ADR 0019: dl-backends builds libllama as a shared lib and
        # ships every ggml backend (CPU variants + accelerators) as
        # MODULE libs that libllama dlopen's at runtime. The
        # build.rs `stage_backends_dir` step copies them all into
        # `target/<target>/release/backends/` for the staging step
        # below to bundle.
        #
        # Per-target features come from the matrix entry (some targets
        # add accelerator features like `cuda` on x86_64-linux).
        run: cargo build --release --bin inferd-daemon --features ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Build inferdctl CLI
        # Single CLI binary in the gh / kubectl shape: subcommands
        # status, watch, pull, doctor (and, in a future release, a
        # default `-p "..."` prompt mode replacing the previously-
        # scaffolded `inferd-stdio`). No llamacpp dependency —
        # pulls in `inferd-daemon` as a library for shared store +
        # fetch types but doesn't enable the FFI feature.
        #
        # Renamed from `inferd` in v0.2.1: the standalone `inferd`
        # name on crates.io is squatted, so the CLI binary is now
        # `inferdctl`. See ADR 0018.
        run: cargo build --release --bin inferdctl --target ${{ matrix.target }}

      # Belt-and-braces: assert the produced binary's CLI actually
      # accepts `--backend llamacpp`. This is the *direct* test —
      # if the daemon's BackendKind::Llamacpp arm got compiled out,
      # clap's value-enum doesn't list `llamacpp` and `--help` won't
      # mention it. Catches the v0.1.1/0.1.3-class bug at the
      # release-job layer before any artifact is uploaded.
      #
      # An earlier version of this check used a binary-size threshold
      # (≥10 MB), but stripped Linux release binaries with statically
      # linked libllama come in around 9 MB — the size check produced
      # false positives. The CLI-surface check is the right shape.
      - name: Verify binary advertises --backend llamacpp
        shell: bash
        run: |
          set -euo pipefail
          rel="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="$rel/inferd-daemon.exe"
            # dl-backends links the daemon against llama.dll, which
            # build.rs stages into $rel/backends/. Windows resolves
            # imported DLLs at process startup from the exe's own dir +
            # PATH — it does NOT search subdirs. So `inferd-daemon.exe
            # --help` fails to start (exit 127, "0xC0000135 not
            # found") with llama.dll one level down. install.ps1
            # already flattens backends/*.dll next to the exe at
            # install time; do the equivalent here so the verify step
            # mirrors what real users see post-install.
            cp -v "$rel"/backends/*.dll "$rel/" 2>/dev/null || true
          fi
          [ "${{ runner.os }}" = "Windows" ] || bin="$rel/inferd-daemon"
          ls -la "$bin"
          if ! "$bin" --help 2>&1 | grep -qE 'llamacpp'; then
            echo "FAIL: built binary does NOT advertise --backend llamacpp" >&2
            "$bin" --help >&2 || true
            exit 1
          fi
          echo "OK: --backend llamacpp present in CLI surface"

      - name: Verify dl-backends staging populated
        # ADR 0019 / phase 5b. Asserts build.rs's stage_backends_dir
        # actually ran and produced runtime-loadable libs. Catches the
        # silent regression where someone flips back to `--features
        # inferd-daemon/llamacpp` (static path) by accident — that
        # would build a working binary but ship a tarball with no
        # backends, which falls through to "no backend registered" at
        # runtime.
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release/backends"
          if [ ! -d "$dir" ]; then
            echo "FAIL: $dir does not exist" >&2
            exit 1
          fi
          count=$(ls -1 "$dir" 2>/dev/null | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "FAIL: $dir has $count file(s); expected ≥2 (libllama + at least one ggml-cpu variant)" >&2
            ls -la "$dir" >&2 || true
            exit 1
          fi
          echo "OK: $dir has $count staged libraries"
          ls -la "$dir"

      # Per-target accelerator MODULE check. The point of enabling
      # `cuda` on x86_64-linux is to ship `libggml-cuda.so` in the
      # tarball — if it's missing, the runtime probe falls back to CPU
      # on every NVIDIA host that downloads the tarball, defeating the
      # whole runtime-accelerator-detection promise (ADR 0019). Same
      # logic applies to Metal on aarch64-darwin.
      - name: Verify accelerator MODULE present (Linux x86_64 → CUDA)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release/backends"
          if ! ls "$dir" | grep -q '^libggml-cuda\.so$'; then
            echo "FAIL: libggml-cuda.so missing from $dir — CUDA build silently produced CPU-only tarball" >&2
            ls -la "$dir" >&2
            exit 1
          fi
          echo "OK: libggml-cuda.so present in $dir"

      - name: Verify accelerator MODULE present (macOS arm64 → Metal)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release/backends"
          # Mac Claude found that ggml_backend_load_all uses .so on all
          # Unix targets (macOS included) — install-launchagent.sh
          # flattens both *.dylib and *.so. Either name is acceptable
          # here as long as a metal MODULE shipped.
          if ! ls "$dir" | grep -qE '^libggml-metal\.(so|dylib)$'; then
            echo "FAIL: libggml-metal.{so,dylib} missing from $dir — Metal build silently produced CPU-only tarball" >&2
            ls -la "$dir" >&2
            exit 1
          fi
          echo "OK: libggml-metal MODULE present in $dir"

      # Bundle the CUDA runtime libs (libcudart, libcublas, libcublasLt)
      # next to libggml-cuda.so. Without this, the daemon's runtime
      # accelerator probe (ADR 0019) silently falls back to CPU on every
      # NVIDIA host that downloads the tarball: ggml uses dlopen() on the
      # MODULE and dlopen quietly fails with "libcudart.so.12: cannot open
      # shared object file" if the deps aren't resolvable. Bundling the
      # CUDA runtime libs into backends/ alongside the MODULE — combined
      # with the $ORIGIN RPATH baked into libggml-cuda.so by ggml's
      # CMake — means dlopen finds them with no system-wide CUDA install
      # required on the consumer machine.
      #
      # NVIDIA's EULA explicitly permits redistribution of these
      # specific runtime libs (cuda-redist list:
      # https://docs.nvidia.com/cuda/eula/#attachment-a). We only ship
      # libcudart.so.12 / libcublas.so.12 / libcublasLt.so.12 — not the
      # toolkit, not nvcc.
      #
      # Discovery is via `ldd libggml-cuda.so | grep "not found"`: we
      # find every dep that doesn't resolve in the staging dir, locate
      # the matching .so under CUDA_PATH/lib64 or the system lib dir,
      # and copy it (dereferencing symlinks via -L so the bundled file
      # is the actual ELF). After bundling, re-run ldd inside the dir
      # and fail if any dep still doesn't resolve.
      - name: Bundle CUDA runtime libs (Linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          backends_dir="target/${{ matrix.target }}/release/backends"
          module="$backends_dir/libggml-cuda.so"
          if [ ! -f "$module" ]; then
            echo "FAIL: $module missing — earlier step should have caught this" >&2
            exit 1
          fi

          # patchelf forces DT_RUNPATH=$ORIGIN on libggml-cuda.so so the
          # loader resolves NEEDED SONAMEs from the lib's own dir (where
          # we'll bundle them below). ggml's CMake usually does this
          # already, but BUILD_RPATH_USE_ORIGIN/INSTALL_RPATH behaviour
          # is fiddly. patchelf is idempotent: if $ORIGIN is already in
          # RUNPATH the second call is a no-op.
          if ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get install -y patchelf
          fi
          patchelf --set-rpath '$ORIGIN' "$module"

          # Where to look for redist libs. Jimver/cuda-toolkit installs
          # under /usr/local/cuda-<ver>; cublas is installed via apt to
          # /usr/lib/x86_64-linux-gnu/. Both are searched in order.
          search_dirs=()
          if [ -n "${CUDA_PATH:-}" ] && [ -d "$CUDA_PATH/lib64" ]; then
            search_dirs+=("$CUDA_PATH/lib64")
          fi
          if [ -d "/usr/local/cuda-12.6/lib64" ]; then
            search_dirs+=("/usr/local/cuda-12.6/lib64")
          fi
          if [ -d "/usr/local/cuda-12.6/targets/x86_64-linux/lib" ]; then
            search_dirs+=("/usr/local/cuda-12.6/targets/x86_64-linux/lib")
          fi
          if [ -d "/usr/lib/x86_64-linux-gnu" ]; then
            search_dirs+=("/usr/lib/x86_64-linux-gnu")
          fi

          # Driver-provided libs that we must NEVER bundle. NVIDIA's
          # EULA forbids redistributing them; they're version-locked
          # to the user's installed driver and resolved at runtime
          # by the driver install (/usr/lib/wsl/lib/libcuda.so.1 on
          # WSL, /usr/lib/x86_64-linux-gnu/libcuda.so.1 on bare
          # metal). Hosts without an NVIDIA driver legitimately
          # don't resolve these, and the accelerator probe correctly
          # falls through to CPU.
          driver_skiplist="libcuda.so.1 libnvidia-ml.so.1"

          # System libs (glibc family + libstdc++/libgcc) that we must
          # NEVER bundle either. These resolve from the CONSUMER's own
          # glibc at runtime. Bundling the runner's copies is actively
          # harmful: libggml-cuda.so's RUNPATH is `$ORIGIN`, so a
          # bundled libc.so.6 would be *preferred* over the host's —
          # and the runner's glibc is almost never bit-identical to the
          # consumer's. The mismatch surfaces as the loader pulling a
          # stale libc.so.6 that the host's libdl/libpthread/librt then
          # fail against with `undefined symbol: __nptl_change_stack_perm,
          # version GLIBC_PRIVATE` (caught in the rc.7 WSL validation).
          # The final verification pass below already treats these as
          # host-resolved; this matching predicate keeps the COPY loop
          # from staging them in the first place.
          is_system_lib() {
            case "$1" in
              libc.so.*|libm.so.*|libdl.so.*|librt.so.*|libpthread.so.*|libstdc++.so.*|libgcc_s.so.*|ld-linux-*.so.*)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          # Walk DT_NEEDED transitively via readelf — NOT ldd. ldd
          # consults /etc/ld.so.cache, which on the GHA runner
          # contains /etc/ld.so.conf.d/cuda-12-6.conf entries pointing
          # at the toolkit install dir, so it falsely "resolves" libs
          # the consumer host won't have. readelf -d reads NEEDED
          # straight from the ELF dynamic section — it doesn't lie.
          #
          # Algorithm: BFS from libggml-cuda.so. For every NEEDED
          # SONAME not yet in backends/ and not in the driver
          # skiplist, locate it under search_dirs and copy under its
          # SONAME (with -L to dereference the version symlink so
          # the bundled file is the actual ELF). After copying,
          # enqueue its own NEEDED entries. Loop until the queue
          # empties — gives us the full transitive closure
          # (libcublas → libcublasLt, etc).
          declare -A bundled
          declare -A on_skiplist
          for s in $driver_skiplist; do on_skiplist[$s]=1; done

          # Seed queue with libggml-cuda.so's direct NEEDED entries.
          mapfile -t queue < <(readelf -d "$module" | awk '/NEEDED/ { gsub(/\[|\]/, "", $5); print $5 }')

          while [ "${#queue[@]}" -gt 0 ]; do
            soname="${queue[0]}"
            queue=("${queue[@]:1}")

            # Already bundled? Skip.
            if [ -n "${bundled[$soname]:-}" ]; then continue; fi
            # Driver lib? Skip.
            if [ -n "${on_skiplist[$soname]:-}" ]; then
              echo "skip: $soname is driver-provided (resolved at runtime)"
              bundled[$soname]=skip
              continue
            fi
            # System lib (glibc family / libstdc++ / libgcc)? Skip —
            # MUST resolve from the consumer's own glibc, never from a
            # bundled copy (see is_system_lib comment above). We don't
            # even walk its NEEDED: the host loader owns that subtree.
            if is_system_lib "$soname"; then
              echo "skip: $soname is a system lib (resolved by consumer glibc)"
              bundled[$soname]=system
              continue
            fi
            # Already present in backends/ (e.g. libllama.so, ggml-*)?
            # Then it was staged by build.rs, no copy needed; still
            # walk its NEEDED for transitive closure.
            if [ -e "$backends_dir/$soname" ]; then
              bundled[$soname]=staged
            else
              # Locate the lib under search_dirs.
              found=""
              for d in "${search_dirs[@]}"; do
                if [ -e "$d/$soname" ]; then found="$d/$soname"; break; fi
              done
              if [ -z "$found" ]; then
                echo "FAIL: could not locate $soname in any of ${search_dirs[*]}" >&2
                exit 1
              fi
              cp -Lv "$found" "$backends_dir/$soname"
              bundled[$soname]=copied
            fi

            # Walk NEEDED of the bundled/staged lib for transitive deps.
            mapfile -t deps < <(readelf -d "$backends_dir/$soname" | awk '/NEEDED/ { gsub(/\[|\]/, "", $5); print $5 }')
            for dep in "${deps[@]}"; do queue+=("$dep"); done
          done

          echo "--- bundle decisions ---"
          for k in "${!bundled[@]}"; do echo "  $k -> ${bundled[$k]}"; done

          # Final verification: walk NEEDED again from libggml-cuda.so
          # transitively and assert every SONAME is either present in
          # backends/ or on the driver skiplist. This catches a class
          # of bug where the loop above missed a transitive dep.
          declare -A seen
          stack=("$module")
          while [ "${#stack[@]}" -gt 0 ]; do
            cur="${stack[-1]}"
            unset 'stack[-1]'
            mapfile -t deps < <(readelf -d "$cur" | awk '/NEEDED/ { gsub(/\[|\]/, "", $5); print $5 }')
            for dep in "${deps[@]}"; do
              if [ -n "${seen[$dep]:-}" ]; then continue; fi
              seen[$dep]=1
              if [ -n "${on_skiplist[$dep]:-}" ]; then continue; fi
              if [ -e "$backends_dir/$dep" ]; then
                stack+=("$backends_dir/$dep")
              else
                # Some NEEDEDs are libc/libstdc++/libm — those resolve
                # via the consumer's glibc and don't need bundling.
                # Allow common system libs through.
                case "$dep" in
                  libc.so.*|libm.so.*|libdl.so.*|librt.so.*|libpthread.so.*|libstdc++.so.*|libgcc_s.so.*|ld-linux-*.so.*)
                    ;;
                  *)
                    echo "FAIL: $dep missing from backends/ and not a system lib or driver lib" >&2
                    exit 1
                    ;;
                esac
              fi
            done
          done
          echo "OK: libggml-cuda.so transitive closure resolves under backends/ + driver skiplist + system libs"
          ls -la "$backends_dir"

      - name: Stage release contents
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/inferd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          # ADR 0019: bundle the dl-backends staging dir produced by
          # build.rs (`stage_backends_dir`). The whole `backends/`
          # subtree must ship next to the daemon binary — libllama
          # has RPATH `$ORIGIN` / `@loader_path` baked in, so it
          # loads MODULE libs from `<bin dir>/` and friends. Fail
          # loudly if the dir is missing: a release tarball without
          # backends would silently fall back to "no backend
          # registered" at runtime.
          backends_src="target/${{ matrix.target }}/release/backends"
          if [ ! -d "$backends_src" ] || [ -z "$(ls -A "$backends_src" 2>/dev/null)" ]; then
            echo "FAIL: $backends_src missing or empty — dl-backends staging didn't run" >&2
            exit 1
          fi
          cp -r "$backends_src" "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/inferd-daemon.exe" "$stage/"
            cp "target/${{ matrix.target }}/release/inferdctl.exe" "$stage/"
            mkdir -p "$stage/packaging"
            cp packaging/windows/install.ps1 "$stage/packaging/"
            cp packaging/windows/uninstall.ps1 "$stage/packaging/"
            cp packaging/windows/cleanup-legacy-service.ps1 "$stage/packaging/"
            cp packaging/README.md "$stage/packaging/"
          else
            cp "target/${{ matrix.target }}/release/inferd-daemon" "$stage/"
            cp "target/${{ matrix.target }}/release/inferdctl" "$stage/"
            mkdir -p "$stage/packaging"
            cp packaging/README.md "$stage/packaging/"
            case "${{ runner.os }}" in
              Linux)
                cp packaging/systemd/inferd.service "$stage/packaging/"
                ;;
              macOS)
                cp packaging/launchd/io.inferd.daemon.plist "$stage/packaging/"
                cp packaging/launchd/install-launchagent.sh "$stage/packaging/"
                cp packaging/launchd/uninstall-launchagent.sh "$stage/packaging/"
                chmod +x "$stage/packaging/install-launchagent.sh" "$stage/packaging/uninstall-launchagent.sh"
                ;;
            esac
          fi
          echo "--- stage root ---"
          ls -la "$stage"
          echo "--- backends/ ---"
          ls -la "$stage/backends"

      - name: Pack tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          tar czf "../inferd-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            "inferd-${GITHUB_REF_NAME}-${{ matrix.target }}"

      - name: Pack zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "inferd-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
          $stage = "staging/inferd-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          Compress-Archive -Path $stage -DestinationPath $archive

      # Belt-and-braces verification: anyone who downloads a tarball can
      # compute `shasum -a 256 -c <archive>.sha256` without any tooling
      # beyond coreutils. Cosign bundles cover provenance; SHA256
      # sidecars cover transit/storage corruption.
      - name: Generate SHA256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          archive="inferd-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: inferd-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            inferd-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            inferd-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --target-in-filename
          mkdir -p sbom-out
          mv crates/*/*.cdx.json sbom-out/ 2>/dev/null || true
          mv *.cdx.json sbom-out/ 2>/dev/null || true
          ls -la sbom-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: sbom-out/

  publish:
    name: Sign + publish release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      # Need the repo on disk so we can extract the CHANGELOG section
      # for the release body.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist/

      - name: Flatten artefact tree
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Each `dist/inferd-...-<target>/` dir holds one archive +
          # one .sha256 sidecar; SBOMs live under `dist/sbom/`.
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \
                              -o -name '*.sha256' -o -name '*.cdx.json' \) \
            -exec mv {} release-assets/ \;
          ls -la release-assets

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign artefacts (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --bundle "$f.cosign.bundle" \
              "$f"
          done
          ls -la

      # Asset-completeness sanity check. The matrix builds 4 platforms,
      # each producing 1 archive + 1 SHA256 sidecar + (after signing) 1
      # cosign bundle. SBOMs are 5 .cdx.json files (one per workspace
      # crate). If any are missing the workflow fails LOUDLY before
      # publishing rather than shipping a half-populated release page.
      - name: Verify asset completeness
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          archives=$(ls -1 *.tar.gz *.zip 2>/dev/null | wc -l)
          shas=$(ls -1 *.sha256 2>/dev/null | wc -l)
          bundles=$(ls -1 *.cosign.bundle 2>/dev/null | wc -l)
          sboms=$(ls -1 *.cdx.json 2>/dev/null | wc -l)
          echo "archives=$archives shas=$shas bundles=$bundles sboms=$sboms"
          fail=0
          if [ "$archives" -lt 4 ]; then echo "FAIL: expected 4 archives, got $archives" >&2; fail=1; fi
          if [ "$shas"     -lt 4 ]; then echo "FAIL: expected 4 sha256 sidecars, got $shas" >&2; fail=1; fi
          if [ "$bundles"  -lt 4 ]; then echo "FAIL: expected 4 cosign bundles, got $bundles" >&2; fail=1; fi
          if [ "$sboms"    -lt 1 ]; then echo "FAIL: expected at least one SBOM, got $sboms" >&2; fail=1; fi
          if [ "$archives" -ne "$shas" ] || [ "$archives" -ne "$bundles" ]; then
            echo "FAIL: archive/sha/bundle counts do not match" >&2
            fail=1
          fi
          [ "$fail" -eq 0 ]

      # Carve the matching `## [x.y.z]` section out of CHANGELOG.md and
      # use it as the release body. Falls back to auto-generated notes
      # if the section can't be found (so a release that pre-dated the
      # carving still publishes cleanly).
      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Print lines from the matching `## [x.y.z]` heading up to
          # (but not including) the next `## ` heading. Uses index()
          # for the heading match so the brackets stay literal across
          # gawk / mawk / busybox awk dialects.
          body=$(awk -v marker="## [${version}]" '
            !found && index($0, marker) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "no-section=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG section for $version; falling back to auto-generated notes."
          else
            echo "no-section=false" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<__EOF__'
              echo "$body"
              echo '__EOF__'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/*.cdx.json
            release-assets/*.cosign.bundle
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.no-section == 'true' }}
          fail_on_unmatched_files: true
