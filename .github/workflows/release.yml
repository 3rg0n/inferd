name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0-alpha.1`). Builds the
# inferd-daemon binary on every supported platform, signs the artefact
# with cosign (keyless OIDC), generates a CycloneDX SBOM, and attaches
# everything to a GitHub Release.
#
# Platforms shipped:
#   - linux x86_64 (gnu)
#   - linux aarch64 (gnu)
#   - macos aarch64 (Apple Silicon)
#   - windows x86_64 (msvc)
#
# Default builds only — no llamacpp feature in the shipped binaries.
# Operators wanting the FFI engine build from source for now (M2c+
# revisits this if a linkable libllama distribution becomes practical).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create release + upload assets
  id-token: write   # cosign keyless signing

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        if: '!matrix.cross'
        run: cargo build --release --bin inferd-daemon --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --bin inferd-daemon --target ${{ matrix.target }}

      - name: Stage release contents
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/inferd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/inferd-daemon.exe" "$stage/"
          else
            cp "target/${{ matrix.target }}/release/inferd-daemon" "$stage/"
          fi
          ls -la "$stage"

      - name: Pack tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          tar czf "../inferd-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            "inferd-${GITHUB_REF_NAME}-${{ matrix.target }}"

      - name: Pack zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "inferd-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
          $stage = "staging/inferd-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          Compress-Archive -Path $stage -DestinationPath $archive

      - uses: actions/upload-artifact@v4
        with:
          name: inferd-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            inferd-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --target-in-filename
          mkdir -p sbom-out
          mv crates/*/*.cdx.json sbom-out/ 2>/dev/null || true
          mv *.cdx.json sbom-out/ 2>/dev/null || true
          ls -la sbom-out
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-out/

  publish:
    name: Sign + publish release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artefact tree
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Each `dist/inferd-...-<target>/` dir holds one archive; SBOMs
          # live under `dist/sbom/`. Move everything to release-assets/.
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.cdx.json' \) \
            -exec mv {} release-assets/ \;
          ls -la release-assets

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artefacts (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --bundle "$f.cosign.bundle" \
              "$f"
          done
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.cdx.json
            release-assets/*.cosign.bundle
          generate_release_notes: true
          fail_on_unmatched_files: true
