name: CI

# Runs on every push and pull-request. Three concerns:
# 1. fmt + clippy + test on the default feature set, three platforms.
# 2. fmt + clippy + test under the `llamacpp` feature (CMake + bindgen
#    pull a C++ toolchain). Same three platforms; libclang is needed
#    for bindgen, installed per-OS in the matrix.
# 3. cargo audit on a separate job so a pulled-but-known-good build
#    never blocks a PR — vulnerability findings open issues, not
#    blockers, until someone classifies them. (Hard-blocking PRs on a
#    pulled-into-the-tree dep is what got Trivy compromised in the
#    March 2026 supply-chain incident. We don't repeat that posture.)

on:
  push:
    branches: [main, v0.2-dev, v0.3-dev]
  pull_request:
    branches: [main, v0.2-dev, v0.3-dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  default:
    name: ${{ matrix.os }} / default
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  openai:
    name: ${{ matrix.os }} / openai-compat feature
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `openai` enables the rustls-backed reqwest client and the
      # eventsource-stream / futures-util deps; wiremock is dev-only.
      # No system libraries needed (rustls, no OpenSSL).
      - run: cargo clippy --all-targets --features inferd-engine/openai -- -D warnings
      - run: cargo test -p inferd-engine --features openai

  llamacpp:
    name: ${{ matrix.os }} / llamacpp feature
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # libclang for bindgen.
      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm
      # Windows runners ship LLVM; bindgen 0.71 finds it via the
      # registry. No explicit install needed in CI.

      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features inferd-engine/llamacpp -- -D warnings
      - run: cargo test --all --features inferd-engine/llamacpp

  dl-backends:
    # ADR 0019 (v0.3): the dl-backends path builds libllama as a
    # shared lib and ships every ggml backend (CPU variants on
    # x86_64, plus per-platform accelerator MODULEs) as a separately
    # dlopen'd library. This job is the same shape as `llamacpp` but
    # exercises the runtime accelerator probe + the build.rs
    # stage_backends_dir hook + the RPATH bake. Once dl-backends
    # becomes the default (post-Phase 7 install=work validation), the
    # static `llamacpp` job either retires or shrinks to a no-cuda
    # x86_64 sanity check.
    name: ${{ matrix.os }} / dl-backends feature
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --all-targets --features inferd-engine/dl-backends -- -D warnings

      - name: test
        run: cargo test --all --features inferd-engine/dl-backends

      # Phase 5a/5b verification: every dl-backends build must
      # produce a populated `target/debug/backends/` (test build) so
      # the release pipeline can stage from `target/release/backends/`
      # later. CI runs the test build, which hits build.rs's
      # stage_backends_dir at the same hook. Failing here means
      # release tarballs would also ship empty.
      - name: Verify backends/ staging populated
        shell: bash
        run: |
          set -euo pipefail
          dir="target/debug/backends"
          if [ ! -d "$dir" ]; then
            echo "FAIL: $dir missing — stage_backends_dir didn't run" >&2
            exit 1
          fi
          count=$(ls -1 "$dir" 2>/dev/null | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "FAIL: $dir has $count file(s); expected ≥2" >&2
            ls -la "$dir" >&2 || true
            exit 1
          fi
          echo "OK: $dir has $count staged libraries"
          ls -la "$dir"

  security:
    name: ${{ matrix.os }} / Tier 5 security regression
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tier 5 security suite
        run: cargo test -p inferd-daemon --features security --test security

  go-client:
    name: ${{ matrix.os }} / go client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          # Track stable; the go.mod requires 1.21+ so this only ever
          # widens compatibility with the test toolchain.
          go-version: 'stable'
          # No go.sum (zero external deps) so the module cache has
          # nothing to key off — disable to silence the cache-miss
          # annotation.
          cache: false
      - uses: Swatinem/rust-cache@v2
      # The end-to-end Go test launches the daemon binary; build it first.
      - run: cargo build -p inferd-daemon
      - name: go vet
        working-directory: clients/go
        run: go vet ./...
      - name: go test
        working-directory: clients/go
        run: go test ./...

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Schedule + manual dispatch only — does not block PRs.
    # See module comment for rationale.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  systemd-unit:
    name: systemd-unit smoke (ubuntu)
    runs-on: ubuntu-latest
    # The handoff doc (inferd-linux-handoff.md §6) called out a
    # systemd-unit-on-real-systemd CI fixture as the way to catch
    # regressions in:
    #   - RuntimeDirectory= auto-creation
    #   - the XDG_RUNTIME_DIR resolution chain in default_admin_addr
    #   - the hardening directives (ProtectSystem=strict etc.)
    #     accidentally locking the daemon out of paths it needs
    #   - StartLimitBurst containment when the daemon panics on missing
    #     assets
    #
    # GitHub's ubuntu-latest runner has systemd PID 1 and a working
    # systemd --user, but the `runner` user isn't a logind login session
    # by default — XDG_RUNTIME_DIR isn't exported to the action's shell
    # and the user-bus may not be running. `loginctl enable-linger`
    # plus a manual XDG_RUNTIME_DIR export bridges that.
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build daemon (mock backend, release)
        run: cargo build --release -p inferd-daemon

      - name: Set up systemd user session
        # GitHub Actions doesn't export XDG_RUNTIME_DIR; systemd-logind
        # has provisioned /run/user/<uid>/ but the env var isn't
        # reaching `bash`. `loginctl enable-linger` keeps the user bus
        # alive without an interactive session; we then export
        # XDG_RUNTIME_DIR for every subsequent step.
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          # Give logind a moment to spin up the user bus.
          for i in 1 2 3 4 5; do
            if [ -S "/run/user/${uid}/bus" ]; then break; fi
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"

      - name: Install daemon binary + systemd unit
        run: |
          mkdir -p ~/.local/bin ~/.config/systemd/user
          install -m 755 target/release/inferd-daemon ~/.local/bin/inferd-daemon
          install -m 644 packaging/systemd/inferd.service ~/.config/systemd/user/inferd.service
          # v0.4 (ADR 0021): the shipped unit binds the single generation
          # socket (inferd.sock) by default — no --v2 flag to flip on.
          #
          # This is a MOCK build (`cargo build -p inferd-daemon`, no
          # llamacpp feature) on a GPU-less runner with no model. The
          # shipped unit deliberately omits `--backend` (defers to
          # ~/.inferd/config.json → real llamacpp backends + auto_pull).
          # As of v0.4 the daemon REFUSES to start with no usable backend
          # rather than silently serving mock (GA install=work hardening),
          # so the smoke must ask for mock explicitly. Append it to the
          # unit's first ExecStart line.
          sed -i 's|\(ExecStart=%h/.local/bin/inferd-daemon\)|\1 --backend mock|' \
            ~/.config/systemd/user/inferd.service

      - name: Start inferd via systemctl --user
        run: |
          systemctl --user daemon-reload
          systemctl --user start inferd
          # Give it a moment to bind sockets.
          for i in 1 2 3 4 5; do
            if systemctl --user is-active --quiet inferd; then break; fi
            sleep 1
          done
          systemctl --user status inferd --no-pager
          systemctl --user is-active inferd

      - name: Verify runtime artefacts and modes
        run: |
          ls -la "${XDG_RUNTIME_DIR}/inferd/"
          # Sockets must exist and have the spec-mandated modes (v0.4 /
          # ADR 0021 — one generation socket on the neutral path):
          #   admin.sock   srw------- (0600)
          #   inferd.sock  srw-rw---- (0660)
          test -S "${XDG_RUNTIME_DIR}/inferd/admin.sock"
          test -S "${XDG_RUNTIME_DIR}/inferd/inferd.sock"
          test -f "${XDG_RUNTIME_DIR}/inferd/inferd.lock"
          # `stat -c %a` prints octal mode; check exact bytes.
          [ "$(stat -c %a "${XDG_RUNTIME_DIR}/inferd/admin.sock")" = "600" ]
          [ "$(stat -c %a "${XDG_RUNTIME_DIR}/inferd/inferd.sock")" = "660" ]

      - name: Smoke a length-prefixed v2 request through the generation UDS
        # v0.4 (ADR 0021): the single generation socket speaks the
        # length-prefixed, type-tagged wire — [uvarint payload_len]
        # [1 byte type: 0x01 JSON / 0x02 BLOB][payload] — with an in-band
        # wire_version. Mock backend advertises v2 + thinking; dispatch
        # must route via the router and stream a Done frame back. Catches
        # regressions in: generation socket binding, RequestV2 resolve,
        # the router's V2-capable check, the LP frame codec, and the
        # wire_version gate.
        run: |
          python3 - <<PY
          import socket, json, os, sys

          def write_uvarint(n):
              out = bytearray()
              while True:
                  b = n & 0x7f
                  n >>= 7
                  if n:
                      out.append(b | 0x80)
                  else:
                      out.append(b)
                      return bytes(out)

          def write_lp_json(s, obj):
              payload = json.dumps(obj).encode()
              s.sendall(write_uvarint(len(payload)) + b"\x01" + payload)

          def read_uvarint(s):
              shift = 0; val = 0
              while True:
                  b = s.recv(1)
                  if not b:
                      print("EOF reading varint", file=sys.stderr); sys.exit(1)
                  val |= (b[0] & 0x7f) << shift
                  if not (b[0] & 0x80):
                      return val
                  shift += 7

          def read_exact(s, n):
              buf = b""
              while len(buf) < n:
                  chunk = s.recv(n - len(buf))
                  if not chunk:
                      print("EOF reading payload", file=sys.stderr); sys.exit(1)
                  buf += chunk
              return buf

          def read_lp_frame(s):
              n = read_uvarint(s)
              ftype = read_exact(s, 1)
              return ftype[0], read_exact(s, n)

          sock_path = os.path.join(os.environ["XDG_RUNTIME_DIR"], "inferd", "inferd.sock")
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect(sock_path)
          req = {
              "wire_version": 1,
              "id": "ci-systemd-v2",
              "messages": [{
                  "role": "user",
                  "content": [{"type": "text", "text": "hello"}],
              }],
              "max_tokens": 4,
          }
          write_lp_json(s, req)
          done = False
          while not done:
              ftype, payload = read_lp_frame(s)
              if ftype != 0x01:
                  print(f"unexpected frame type {ftype:#x}", file=sys.stderr); sys.exit(1)
              print("<-", payload.decode())
              frame = json.loads(payload)
              if frame.get("type") == "done":
                  done = True
              elif frame.get("type") == "error":
                  print("daemon returned v2 error frame", file=sys.stderr); sys.exit(1)
          PY

      - name: Verify journal does not show start-loop containment trips
        # Catches regressions where the unit panics on launch and
        # StartLimitBurst engages — the handoff doc §3 bug-class.
        run: |
          journalctl --user -u inferd --no-pager --since=-2min \
            | tee /tmp/inferd-journal.log
          if grep -q "Start request repeated too quickly" /tmp/inferd-journal.log; then
            echo "FAIL: StartLimitBurst engaged — daemon failed to start cleanly"
            exit 1
          fi
          if grep -qE "(Failed with result|exit-code)" /tmp/inferd-journal.log; then
            echo "FAIL: unit reported failure"
            exit 1
          fi

      - name: Collect journal on failure
        if: failure()
        run: |
          journalctl --user -u inferd --no-pager --since=-5min || true
          systemctl --user status inferd --no-pager || true

      - name: Stop and disable
        if: always()
        run: |
          systemctl --user stop inferd || true
          systemctl --user disable inferd || true
