name: CI

# Runs on every push and pull-request. Three concerns:
# 1. fmt + clippy + test on the default feature set, three platforms.
# 2. fmt + clippy + test under the `llamacpp` feature (CMake + bindgen
#    pull a C++ toolchain). Same three platforms; libclang is needed
#    for bindgen, installed per-OS in the matrix.
# 3. cargo audit on a separate job so a pulled-but-known-good build
#    never blocks a PR — vulnerability findings open issues, not
#    blockers, until someone classifies them. (Hard-blocking PRs on a
#    pulled-into-the-tree dep is what got Trivy compromised in the
#    March 2026 supply-chain incident. We don't repeat that posture.)

on:
  push:
    branches: [main, v0.2-dev]
  pull_request:
    branches: [main, v0.2-dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  default:
    name: ${{ matrix.os }} / default
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  llamacpp:
    name: ${{ matrix.os }} / llamacpp feature
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # libclang for bindgen.
      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm
      # Windows runners ship LLVM; bindgen 0.71 finds it via the
      # registry. No explicit install needed in CI.

      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features inferd-engine/llamacpp -- -D warnings
      - run: cargo test --all --features inferd-engine/llamacpp

  security:
    name: ${{ matrix.os }} / Tier 5 security regression
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tier 5 security suite
        run: cargo test -p inferd-daemon --features security --test security

  go-client:
    name: ${{ matrix.os }} / go client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          # Track stable; the go.mod requires 1.21+ so this only ever
          # widens compatibility with the test toolchain.
          go-version: 'stable'
          # No go.sum (zero external deps) so the module cache has
          # nothing to key off — disable to silence the cache-miss
          # annotation.
          cache: false
      - uses: Swatinem/rust-cache@v2
      # The end-to-end Go test launches the daemon binary; build it first.
      - run: cargo build -p inferd-daemon
      - name: go vet
        working-directory: clients/go
        run: go vet ./...
      - name: go test
        working-directory: clients/go
        run: go test ./...

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Schedule + manual dispatch only — does not block PRs.
    # See module comment for rationale.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  systemd-unit:
    name: systemd-unit smoke (ubuntu)
    runs-on: ubuntu-latest
    # The handoff doc (inferd-linux-handoff.md §6) called out a
    # systemd-unit-on-real-systemd CI fixture as the way to catch
    # regressions in:
    #   - RuntimeDirectory= auto-creation
    #   - the XDG_RUNTIME_DIR resolution chain in default_admin_addr
    #   - the hardening directives (ProtectSystem=strict etc.)
    #     accidentally locking the daemon out of paths it needs
    #   - StartLimitBurst containment when the daemon panics on missing
    #     assets
    #
    # GitHub's ubuntu-latest runner has systemd PID 1 and a working
    # systemd --user, but the `runner` user isn't a logind login session
    # by default — XDG_RUNTIME_DIR isn't exported to the action's shell
    # and the user-bus may not be running. `loginctl enable-linger`
    # plus a manual XDG_RUNTIME_DIR export bridges that.
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build daemon (mock backend, release)
        run: cargo build --release -p inferd-daemon

      - name: Set up systemd user session
        # GitHub Actions doesn't export XDG_RUNTIME_DIR; systemd-logind
        # has provisioned /run/user/<uid>/ but the env var isn't
        # reaching `bash`. `loginctl enable-linger` keeps the user bus
        # alive without an interactive session; we then export
        # XDG_RUNTIME_DIR for every subsequent step.
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          # Give logind a moment to spin up the user bus.
          for i in 1 2 3 4 5; do
            if [ -S "/run/user/${uid}/bus" ]; then break; fi
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"

      - name: Install daemon binary + systemd unit
        run: |
          mkdir -p ~/.local/bin ~/.config/systemd/user
          install -m 755 target/release/inferd-daemon ~/.local/bin/inferd-daemon
          install -m 644 packaging/systemd/inferd.service ~/.config/systemd/user/inferd.service

      - name: Start inferd via systemctl --user
        run: |
          systemctl --user daemon-reload
          systemctl --user start inferd
          # Give it a moment to bind sockets.
          for i in 1 2 3 4 5; do
            if systemctl --user is-active --quiet inferd; then break; fi
            sleep 1
          done
          systemctl --user status inferd --no-pager
          systemctl --user is-active inferd

      - name: Verify runtime artefacts and modes
        run: |
          ls -la "${XDG_RUNTIME_DIR}/inferd/"
          # Sockets must exist and have the spec-mandated modes:
          #   admin.sock   srw------- (0600)
          #   infer.sock   srw-rw---- (0660)
          test -S "${XDG_RUNTIME_DIR}/inferd/admin.sock"
          test -S "${XDG_RUNTIME_DIR}/inferd/infer.sock"
          test -f "${XDG_RUNTIME_DIR}/inferd/inferd.lock"
          # `stat -c %a` prints octal mode; check exact bytes.
          [ "$(stat -c %a "${XDG_RUNTIME_DIR}/inferd/admin.sock")" = "600" ]
          [ "$(stat -c %a "${XDG_RUNTIME_DIR}/inferd/infer.sock")" = "660" ]

      - name: Smoke an NDJSON request through the inference UDS
        run: |
          python3 - <<PY
          import socket, json, os, sys
          sock_path = os.path.join(os.environ["XDG_RUNTIME_DIR"], "inferd", "infer.sock")
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect(sock_path)
          req = {"id":"ci-systemd","messages":[{"role":"user","content":"hello"}],"max_tokens":4}
          s.sendall((json.dumps(req)+"\n").encode())
          buf = b""
          done = False
          while not done:
              chunk = s.recv(4096)
              if not chunk:
                  print("EOF", file=sys.stderr); sys.exit(1)
              buf += chunk
              while b"\n" in buf:
                  line, buf = buf.split(b"\n", 1)
                  if not line: continue
                  print("<-", line.decode())
                  if b'"type":"done"' in line:
                      done = True
                      break
                  if b'"type":"error"' in line:
                      print("daemon returned error frame", file=sys.stderr); sys.exit(1)
          PY

      - name: Verify journal does not show start-loop containment trips
        # Catches regressions where the unit panics on launch and
        # StartLimitBurst engages — the handoff doc §3 bug-class.
        run: |
          journalctl --user -u inferd --no-pager --since=-2min \
            | tee /tmp/inferd-journal.log
          if grep -q "Start request repeated too quickly" /tmp/inferd-journal.log; then
            echo "FAIL: StartLimitBurst engaged — daemon failed to start cleanly"
            exit 1
          fi
          if grep -qE "(Failed with result|exit-code)" /tmp/inferd-journal.log; then
            echo "FAIL: unit reported failure"
            exit 1
          fi

      - name: Collect journal on failure
        if: failure()
        run: |
          journalctl --user -u inferd --no-pager --since=-5min || true
          systemctl --user status inferd --no-pager || true

      - name: Stop and disable
        if: always()
        run: |
          systemctl --user stop inferd || true
          systemctl --user disable inferd || true
