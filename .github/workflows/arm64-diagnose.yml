# Manual-dispatch verification for the Windows arm64 daemon load crash
# fix (task #185). Root cause (proven by dumpbin /dependents): b9850 links
# OpenMP into ggml-base, and the clang-cl arm64 build needs
# `libomp140.aarch64.dll` at load — a non-system DLL not in the tarball —
# so the daemon crashed with 0xC0000135. Fix: build.rs sets
# GGML_OPENMP=OFF on arm64. This job builds the arm64 daemon (fix now
# default) and launches `--help` to confirm it loads (exit 0) and shows
# `--backend llamacpp`. ~12 min, no release. Delete once #185 lands in a
# release build.
name: arm64-diagnose
on:
  workflow_dispatch: {}

jobs:
  verify:
    name: aarch64 GGML_OPENMP=OFF loads clean
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Install LLVM (Windows arm64)
        uses: KyleMayes/install-llvm-action@a7a1a882e2d06ebe05d5bb97c3e1f8c984ae96fc  # v2.0.7
        with:
          version: '19.1.7'
          arch: arm64
          env: true
      - name: Set up MSVC dev environment (Windows arm64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: arm64

      - name: Build daemon (GGML_OPENMP=OFF now default on arm64)
        run: cargo build --release --bin inferd-daemon --features inferd-daemon/dl-backends --target aarch64-pc-windows-msvc

      - name: Launch --help + confirm no OpenMP dep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rel = "target/aarch64-pc-windows-msvc/release"
          $exe = "$rel/inferd-daemon.exe"
          Copy-Item "$rel/backends/*.dll" "$rel/" -Force -ErrorAction SilentlyContinue
          Write-Host "=== DLLs next to exe (should be NO libomp*) ==="
          Get-ChildItem "$rel/*.dll" | Select-Object -ExpandProperty Name

          # Prove ggml-base no longer imports an OpenMP runtime.
          Write-Host "`n=== ggml-base.dll OpenMP import? (expect none) ==="
          $deps = & dumpbin /dependents "$rel/ggml-base.dll" 2>&1
          $omp = $deps | Where-Object { $_ -match 'libomp' }
          if ($omp) { Write-Host "STILL IMPORTS: $omp" } else { Write-Host "OK: ggml-base.dll imports no libomp*" }

          # The decisive test: launch --help. Capture exit without letting
          # a non-zero code abort the step (the pwsh bug from the last run).
          Write-Host "`n=== launch inferd-daemon.exe --help ==="
          $env:PATH = "$rel;$env:PATH"
          $out = & $exe --help 2>&1
          $code = $LASTEXITCODE
          $out | Select-Object -First 4
          Write-Host "exit code: $code  (0=loads clean; -1073741515=0xC0000135 DLL-not-found)"
          if ($code -ne 0) {
            Write-Host "RESULT: FAIL — still crashes at load."
            exit 1
          }
          if (-not ($out -match 'llamacpp')) {
            Write-Host "RESULT: FAIL — loads but --backend llamacpp missing."
            exit 1
          }
          Write-Host "RESULT: PASS — arm64 daemon loads clean with GGML_OPENMP=OFF and advertises llamacpp."
