# Manual-dispatch diagnostic for the Windows arm64 daemon load crash
# (task #185). b9850 made inferd-daemon.exe crash at process load
# (0xC0000135) on aarch64-pc-windows-msvc even with libomp.dll staged.
# This throwaway workflow builds the arm64 daemon TWO ways — default
# (OpenMP on) and with INFERD_ARM64_DISABLE_OPENMP=1 (GGML_OPENMP=OFF) —
# dumps the DLL import closure of the default build, and launches --help
# on BOTH so we learn (a) the missing dependency and (b) whether
# disabling OpenMP fixes it, in one run. ~20 min, no release. Delete once
# #185 is resolved.
name: arm64-diagnose
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    name: aarch64 DLL-closure + OpenMP-off A/B
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Install LLVM (Windows arm64)
        uses: KyleMayes/install-llvm-action@a7a1a882e2d06ebe05d5bb97c3e1f8c984ae96fc  # v2.0.7
        with:
          version: '19.1.7'
          arch: arm64
          env: true
      - name: Set up MSVC dev environment (Windows arm64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: arm64

      # --- Build A: default (OpenMP ON) ---
      - name: Build daemon (default, OpenMP on)
        run: cargo build --release --bin inferd-daemon --features inferd-daemon/dl-backends --target aarch64-pc-windows-msvc

      - name: Dump DLL closure + launch (default build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rel = "target/aarch64-pc-windows-msvc/release"
          $exe = "$rel/inferd-daemon.exe"
          Copy-Item "$rel/backends/*.dll" "$rel/" -Force -ErrorAction SilentlyContinue
          Write-Host "=== DLLs next to exe ==="
          Get-ChildItem "$rel/*.dll" | Select-Object -ExpandProperty Name

          function Deps($p) {
            Write-Host "`n--- $([IO.Path]::GetFileName($p)) imports: ---"
            # dumpbin /dependents prints '    NAME.dll' lines; match ending in .dll
            & dumpbin /dependents "$p" 2>&1 | Where-Object { $_ -match '^\s+\S+\.dll' }
          }
          Deps $exe
          foreach ($d in 'llama.dll','ggml-base.dll','ggml-cpu.dll','ggml.dll','libomp.dll') {
            if (Test-Path "$rel/$d") { Deps "$rel/$d" }
          }
          Write-Host "`n=== libomp.dll arch ==="
          if (Test-Path "$rel/libomp.dll") { & dumpbin /headers "$rel/libomp.dll" 2>&1 | Where-Object { $_ -match 'machine' } | Select-Object -First 1 }

          Write-Host "`n=== launch --help (DEFAULT / OpenMP ON) ==="
          $env:PATH = "$rel;$env:PATH"
          & $exe --help 2>&1 | Select-Object -First 3
          Write-Host "DEFAULT exit code: $LASTEXITCODE  (0=ok, -1073741515=0xC0000135 DLL-not-found)"

      # --- Build B: OpenMP OFF ---
      - name: Build daemon (INFERD_ARM64_DISABLE_OPENMP=1)
        env:
          INFERD_ARM64_DISABLE_OPENMP: '1'
        run: cargo build --release --bin inferd-daemon --features inferd-daemon/dl-backends --target aarch64-pc-windows-msvc

      - name: Launch (OpenMP-off build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rel = "target/aarch64-pc-windows-msvc/release"
          $exe = "$rel/inferd-daemon.exe"
          Copy-Item "$rel/backends/*.dll" "$rel/" -Force -ErrorAction SilentlyContinue
          Write-Host "=== DLLs next to exe (OpenMP off — libomp should be GONE) ==="
          Get-ChildItem "$rel/*.dll" | Select-Object -ExpandProperty Name
          Write-Host "`n=== launch --help (OpenMP OFF) ==="
          $env:PATH = "$rel;$env:PATH"
          & $exe --help 2>&1 | Select-Object -First 3
          Write-Host "OPENMP-OFF exit code: $LASTEXITCODE  (0=ok → this is the fix)"
          if ($LASTEXITCODE -eq 0) { Write-Host "RESULT: GGML_OPENMP=OFF FIXES the arm64 load crash." }
          else { Write-Host "RESULT: still crashing — root cause is NOT (only) OpenMP." }
